name: CI Backend Test Suite

on:
  push:
    branches: [ main, master, dev, "feat/**", "fix/**" ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/employee_task_db
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/employee_task_test_db
      JWT_SECRET_KEY: ci_test_jwt_secret_key_long_random_value_for_github_actions_12345
      JWT_REFRESH_SECRET_KEY: ci_test_jwt_refresh_secret_key_long_random_value_for_github_actions_12345
      RATE_LIMITER_BACKEND: memory

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Create Application Database in CI
        run: |
          python -c "
          import asyncio, asyncpg
          async def init():
              conn = await asyncpg.connect('postgresql://postgres:postgres@localhost:5432/postgres')
              exists = await conn.fetchval(\"SELECT 1 FROM pg_database WHERE datname = 'employee_task_db'\")
              if not exists:
                  await conn.execute('CREATE DATABASE employee_task_db;')
              await conn.close()
          asyncio.run(init())
          "

      - name: Verify CLI Migrations on Application DB
        run: |
          alembic upgrade head

      - name: Run Pytest Test Suite on Isolated Test DB
        run: |
          pytest --cov=app --cov-report=term-missing
