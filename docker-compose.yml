services:
  # ============================================================================
  # Database Service (PostgreSQL 16)
  # ============================================================================
  db:
    image: postgres:16-alpine
    container_name: employee_task_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-employee_task_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-employee_task_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Application Service (FastAPI API Server)
  # ============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: employee_task_app
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override DATABASE_URL to use docker service name 'db' instead of 'localhost'
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-employee_task_db}
    depends_on:
      db:
        condition: service_healthy

# Persistent Named Volumes
volumes:
  postgres_data:
